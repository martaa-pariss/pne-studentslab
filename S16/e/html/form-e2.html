<!DOCTYPE html>
<html>
<head>
    <title>Echo Form</title>
</head>
<body>
    <h1>Echo Server</h1>

    <form action="/echo" method="get">
        <input type="text" name="message" placeholder="Write something">

        <br><br>

        <label>
            <input type="checkbox" name="uppercase">
            Show in uppercase
        </label>

        <br><br>

        <button type="submit">Send</button>
    </form>
</body>
</html>
